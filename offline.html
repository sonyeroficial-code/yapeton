<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#742284">
  <title>Yape · Offline</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#742284 0%,#4d1561 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;padding:24px}
    .card{width:min(100%,420px);background:rgba(18,12,33,.76);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 14px;opacity:.92;line-height:1.45}
    .meta{font-size:13px;opacity:.74;margin-top:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    a,button{appearance:none;-webkit-appearance:none;border:none;border-radius:999px;padding:12px 16px;font:600 14px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-decoration:none;cursor:pointer}
    .primary{background:#18c7b7;color:#221632}
    .ghost{background:rgba(255,255,255,.1);color:#fff}
  </style>
</head>
<body>
  <main class="card">
    <h1>Estás sin conexión</h1>
    <p>La app no quedó en blanco: el shell principal sigue disponible desde caché y puedes volver a abrir la versión guardada.</p>
    <p>Cuando la red regrese, la PWA actualizará los datos sin bloquear la interfaz.</p>
    <div class="actions">
      <a class="primary" href="./index.html">Abrir app guardada</a>
      <button class="ghost" type="button" id="retryBtn">Reintentar conexión</button>
    </div>
    <div class="meta" id="statusText">Esperando conexión…</div>
  </main>
  <script>
    const statusText = document.getElementById('statusText');
    const retryBtn = document.getElementById('retryBtn');
    function updateStatus(){
      statusText.textContent = navigator.onLine ? 'Conexión detectada. Puedes volver a entrar.' : 'Sin conexión. Se mantiene el modo offline básico.';
    }
    updateStatus();
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    retryBtn.addEventListener('click', function(){
      if(navigator.onLine){
        location.href = './index.html';
      } else {
        updateStatus();
      }
    });
  </script>
</body>
</html>
